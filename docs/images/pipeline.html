<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T0–T9 검증 파이프라인</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph · midam-improve</p>
    <h1>T0–T9 검증 파이프라인</h1>

    <svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="midam-improve-pipeline-title midam-improve-pipeline-desc">
      <title id="midam-improve-pipeline-title">T0–T9 검증 파이프라인</title>
      <desc id="midam-improve-pipeline-desc">test.sh 의 검증 시나리오가 준비, T0 Terraform, ECR 배포 파이프라인 4종, promote 초안과 backend S3 순으로 이어지며, T0 가 만든 ECR 레포와 S3 버킷, T1 의 이미지 digest 와 bootJar 가 다음 단계로 넘어가는 관계를 보여 준다.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M 612,240 V 272 Q 612,280 604,280 H 520 Q 512,280 512,288 V 302" marker-end="url(#arrow)"/>
        <path d="M 668,240 V 272 Q 668,280 676,280 H 760 Q 768,280 768,288 V 302" marker-end="url(#arrow)"/>

        <rect x="832" y="242" width="56" height="16" rx="2" fill="#f5f5f5"/>

        <text x="680" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OIDC · ZONE</text>

        <text x="512" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ IMMUTABLE · 8/8</text>

        <rect x="808" y="310" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="824" y="319" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 in</text>

        <!-- rank 2 · T8 (leaf) -->

        <text x="1024" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skopeo · digest · 5/5</text>

        <rect x="304" y="424" width="160" height="56" rx="6" fill="#f5f5f5"/>

        <text x="384" y="456" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">T4·T6 promote 초안</text>
        <text x="384" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lookup tag &lt;7&gt; · 4/4</text>

        <!-- rank 3 · T9 (leaf) -->
        <rect x="560" y="424" width="160" height="56" rx="6" fill="#f5f5f5"/>

        <rect x="680" y="430" width="32" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>

      <g>

        <path d="M 384,512 V 488" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="384" cy="484" r="2" fill="#2d3142"/>
      </g>

      <!-- ── Legend (bottom strip) ── -->
      <g font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
        <line x1="24" y1="584" x2="1256" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="600" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="612" fill="#4f5d75" font-size="12">다음 단계에 넘겨주는 단계</text>

        <rect x="336" y="600" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

  </div>
</body>
</html>
